# Example Telegraf configuration for the wgkex-influxdb.json Grafana dashboard.
# Scrapes the Prometheus endpoints of the broker and the workers and writes them to InfluxDB
# (measurement "prometheus", one field per metric, labels as tags).

# Broker: GET /metrics on the broker HTTP listener (metrics.broker_endpoint, enabled by default)
[[inputs.prometheus]]
  urls = ["http://broker.example.net:5000/metrics"]
  metric_version = 2
  interval = "30s"
  [inputs.prometheus.tags]
    wgkex_role = "broker"

# Workers: separate listener, only available if metrics.worker_port is set (e.g. 9101)
[[inputs.prometheus]]
  urls = [
    "http://gw04.in.ffmuc.net:9101/metrics",
    "http://gw05.in.ffmuc.net:9101/metrics",
  ]
  metric_version = 2
  interval = "30s"
  [inputs.prometheus.tags]
    wgkex_role = "worker"

[[outputs.influxdb]]
  urls = ["http://influxdb.example.net:8086"]
  database = "telegraf"
